app = 'tanktrouble-server'
primary_region = 'sin'

[build]
  dockerfile = 'apps/server/Dockerfile'

[http_service]
  internal_port = 27491
  force_https = true
  # Keep warm — cold start + seat WebSocket often yields browser 1006
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1

[deploy]
  strategy = 'immediate'
